function ellipsePath(g){const p=new Path2D();p.ellipse(g.cx,g.cy,g.rx,g.ry,0,0,Math.PI*2);return p}
function lipPath(){const g=geometry().lips,p=new Path2D();p.moveTo(g.cx-g.rx,g.cy);p.bezierCurveTo(g.cx-g.rx*.55,g.cy-g.ry*1.15,g.cx-g.rx*.18,g.cy-g.ry*.55,g.cx,g.cy-g.ry*.15);p.bezierCurveTo(g.cx+g.rx*.18,g.cy-g.ry*.55,g.cx+g.rx*.55,g.cy-g.ry*1.15,g.cx+g.rx,g.cy);p.bezierCurveTo(g.cx+g.rx*.55,g.cy+g.ry*1.15,g.cx+g.rx*.16,g.cy+g.ry*.72,g.cx,g.cy+g.ry*.55);p.bezierCurveTo(g.cx-g.rx*.16,g.cy+g.ry*.72,g.cx-g.rx*.55,g.cy+g.ry*1.15,g.cx-g.rx,g.cy);p.closePath();return p}
function mask(region){const g=geometry();if(region==='skin'||region==='face')return ellipsePath(g.face);if(region==='leftCheek')return ellipsePath(g.cheekL);if(region==='rightCheek')return ellipsePath(g.cheekR);if(region==='leftEye')return ellipsePath({...g.eyeL,rx:g.eyeL.rx*1.28,ry:g.eyeL.ry*1.55});if(region==='rightEye')return ellipsePath({...g.eyeR,rx:g.eyeR.rx*1.28,ry:g.eyeR.ry*1.55});if(region==='leftBrow')return ellipsePath(g.browL);if(region==='rightBrow')return ellipsePath(g.browR);if(region==='lips')return lipPath();if(region==='jaw')return ellipsePath(g.jaw);if(region==='highlightL')return ellipsePath(g.highlightL);if(region==='highlightR')return ellipsePath(g.highlightR);return ellipsePath(g.face)}

function targets(p){if(p.target==='cheeks')return['leftCheek','rightCheek'];if(p.target==='eyes')return['leftEye','rightEye'];if(p.target==='eyelids'||p.target==='lashes')return['leftLid','rightLid'];if(p.target==='brows')return['leftBrow','rightBrow'];if(p.target==='highlight')return['highlightL','highlightR'];if(p.target==='lips')return['lips'];if(p.target==='jaw')return['jaw'];return['skin']}
function nearestTarget(p,pt){let best=null;for(const r of targets(p)){const c=centers()[r]||[500,360],d=Math.hypot(pt.x-c[0],pt.y-c[1]);if(!best||d<best.d)best={r,d,c}}return best}
function snap(p,pt,velocity=0){const mods=activeProduct()?.mutators||[],tracking=mods.includes('tracking');if(p.mode==='contour'||p.mode==='fiber'){let best={d:1e9,pt,region:null};for(const r of targets(p)){for(const q of contour(r)){const d=Math.hypot(pt.x-q.x,pt.y-q.y);if(d<best.d)best={d,pt:q,region:r}}}const assist=tracking?.96:(velocity<650?.9:velocity<1200?.68:.42);return{x:lerp(pt.x,best.pt.x,assist),y:lerp(pt.y,best.pt.y,assist),region:best.region,locked:best.d<70,err:best.d}}

function pointer(ev){const r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*1000,y:(ev.clientY-r.top)/r.height*760}}

function submit(){if(state.run.phase==='lab'){saveWork('疯狂实验室作品',0,'实验');toast('作品已保存到作品库');return}const c=currentContract(),r=evaluate(c);if(!r.completed){burst('还差一点！');showModal(`<div class="eyebrow">合同还没成立</div><h2>${Math.round(r.progress*100)}% 完成</h2><p>继续补妆，不会强制结束。</p>${r.details.map(x=>`<p>${x.pass?'✓':'✕'} ${x.label}：${x.value.toFixed(2)} / ${x.target}</p>`).join('')}<button data-close>继续施工</button>`);return}state.run.results.push({id:c.id,progress:r.progress,hype:state.hype});if(state.run.phase==='contract'){save.reputation+=3;save.completed.push(c.id);persist();draft()}else if(state.run.phase==='chaos'){state.run.phase='final';state.metrics={};renderContract();burst('终场来了！','yellow')}else if(state.run.phase==='final'){state.run.phase='complete';showFinal(r)}}
function gallery(){return`<div class="eyebrow">本地作品快照</div><h2>作品库 · ${save.gallery.length}/12</h2>${save.gallery.length?`<div class="gallery">${save.gallery.map(w=>`<article class="work"><img src="${w.img}" alt="${w.title}"><b>${w.title}</b><small>${w.grade} · ${w.score}分 · ${w.build}</small><p>${w.at}</p></article>`).join('')}</div>`:'<p>还没有作品。完成终场或在疯狂实验室保存一次。</p>'}`}
function seedModal(){return`<div class="eyebrow">可复现挑战</div><h2>Seed挑战</h2><p>相同Seed会得到相同合同与三选一序列。</p><input id="seedInput" value="7319-GLAM" style="width:100%;padding:13px;border-radius:12px;border:1px solid #5a3d68;background:#120b19;color:white"><br><br><button class="primary" data-seed="custom">使用这个Seed</button> <button data-seed="daily">今日Seed</button> <button data-seed="weekly">本周Seed</button>`}
function statusHtml(){return`<div class="eyebrow">Gameplay Truth</div><h2>本局状态</h2><p>当前Build：<b>${buildIdentity()}</b></p><p>环境：${state.environment} · 热度：${Math.round(state.hype)} · 连击：${state.combo}</p><h3>合同指标</h3>${Object.entries(state.metrics).map(([k,v])=>`<p>${reqLabel[k]||k}：${v.toFixed(2)}</p>`).join('')||'<p>还没有产生妆效。</p>'}<h3>五官变形</h3><p>眼睛×${state.morph.eye.toFixed(2)} · 唇宽×${state.morph.lipX.toFixed(2)} · 唇厚×${state.morph.lipY.toFixed(2)} · 苹果肌${state.morph.cheek.toFixed(2)}</p>`}
function home(){state.mode='home';$('#game').classList.add('hidden');$('#home').classList.remove('hidden');$('#homeRep').textContent=save.reputation;$('#homeChapter').textContent=save.chapter;$('#homeDisc').textContent=save.discoveries.length+'/24';$('#homeWorks').textContent=save.gallery.length;$('#endlessHome').disabled=save.chapter<6;$('#chapterRow').innerHTML=Array.from({length:6},(_,i)=>{const c=i+1,locked=c>save.chapter;return`<button class="chapter-chip ${c===state.selectedChapter?'active':''}" data-chapter="${c}" ${locked?'disabled':''}>${c}. ${chapterNames[i]}</button>`}).join('')}
function syntheticPaint(productId,region,times=8){const p=PRODUCTS.find(x=>x.id===productId),slot=state.activeSlot;state.run.equipment[slot]={...p,mutators:state.run.equipment[slot]?.mutators||[]};renderDock();const c=centers()[region]||[500,360];for(let i=0;i<times;i++){const pt={x:c[0]+(i%3-1)*10,y:c[1]+(Math.floor(i/3)-1)*7},sn=snap(p,pt,0);actionPoint(p,sn,0)}render()}
function bind(){document.addEventListener('click',e=>{const homeAct=e.target.closest('[data-home]')?.dataset.home;if(homeAct==='story')start('story');else if(homeAct==='lab')start('lab','LAB-'+Date.now());else if(homeAct==='seed')showModal(seedModal());else if(homeAct==='gallery')showModal(gallery());else if(homeAct==='discoveries')showModal(discoveries());else if(homeAct==='endless'&&save.chapter>=6)start('endless','ENDLESS-'+Date.now());const ch=e.target.closest('[data-chapter]')?.dataset.chapter;if(ch){state.selectedChapter=+ch;save.selectedChapter=+ch;persist();home()}if(e.target.closest('[data-close]'))hideModal();const slot=e.target.closest('[data-slot]')?.dataset.slot;if(slot!==undefined&&state.run){state.activeSlot=+slot;state.color=null;renderDock()}const col=e.target.closest('[data-color]')?.dataset.color;if(col){state.color=col;renderDock()}const cat=e.target.closest('[data-cat]')?.dataset.cat;if(cat)$('#modalContent').innerHTML=productCase(cat);const pid=e.target.closest('[data-product]')?.dataset.product;if(pid&&state.run){const old=state.run.equipment[state.activeSlot];state.run.equipment[state.activeSlot]={...PRODUCTS.find(p=>p.id===pid),mutators:[...(old.mutators||[])]};state.color=null;hideModal();renderDock();render()}const mid=e.target.closest('[data-mutator]')?.dataset.mutator;if(mid)chooseMutator(mid);const seed=e.target.closest('[data-seed]')?.dataset.seed;if(seed){let v=$('#seedInput')?.value||'7319-GLAM';if(seed==='daily')v=new Date().toISOString().slice(0,10);if(seed==='weekly'){const d=new Date(),w=Math.ceil((((d-new Date(d.getFullYear(),0,1))/86400000)+1)/7);v=d.getFullYear()+'W'+w}hideModal();start('seed',v)}const fin=e.target.closest('[data-final]')?.dataset.final;if(fin==='home'){hideModal();home()}if(fin==='again'){hideModal();start('story')} });$('#caseBtn').onclick=$('#dockCase').onclick=()=>showModal(productCase());$('#workshopBtn').onclick=()=>showModal(workshop());$('#discBtn').onclick=()=>showModal(discoveries());$('#statusBtn').onclick=()=>showModal(statusHtml());$('#submitBtn').onclick=submit;$('#homeBtn').onclick=home;window.addEventListener('resize',render)}
bind();home();render();
window.__GLAM_TEST__={PRODUCTS,CONTRACTS,MUTATORS,DISCOVERIES,state,save,start,home,currentContract,evaluate,syntheticPaint,submit,chooseMutator,productCase,buildIdentity,snap,geometry,metrics:()=>({...state.metrics}),getGallery:()=>[...save.gallery]};
})();
