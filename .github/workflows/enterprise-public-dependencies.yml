name: Enterprise public offline dependencies
on:
  push:
    branches: [build/enterprise-offline-deps-20261012]
permissions:
  contents: read
concurrency:
  group: enterprise-public-offline-dependencies
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Download and verify public Windows runtime and wheels
        shell: python
        run: |
          import hashlib, json, pathlib, urllib.request, zipfile
          out = pathlib.Path('public-dependencies'); out.mkdir()
          pins = '''annotated_doc 0.0.4 annotated_doc-0.0.4-py3-none-any.whl 571ac1dc6991c450b25a9c2d84a3705e2ae7a53467b5d111c24fa8baabbed320
          annotated_types 0.8.0 annotated_types-0.8.0-py3-none-any.whl f072f4d804ea359e4eaf198b1af7a8b0943881a87f31bb764f8bf219bb9419e0
          anyio 4.13.0 anyio-4.13.0-py3-none-any.whl 08b310f9e24a9594186fd75b4f73f4a4152069e3853f1ed8bfbf58369f4ad708
          certifi 2026.5.20 certifi-2026.5.20-py3-none-any.whl 3c52e209ba0a4ad7aebe60436a4ab349c39e1e602e8c134221e546902ad25897
          cffi 2.0.0 cffi-2.0.0-cp313-cp313-win_amd64.whl 19f705ada2530c1167abacb171925dd886168931e0a7b78f5bffcae5c6b5be75
          click 8.1.8 click-8.1.8-py3-none-any.whl 63c132bbbed01578a06712a2d1f497bb62d9c1c0d329b7903a866228027263b2
          colorama 0.4.6 colorama-0.4.6-py2.py3-none-any.whl 4f1d9991f5acc0ca119f9d443620b77f9d6b33703e51011c16baf57afb285fc6
          cryptography 46.0.4 cryptography-46.0.4-cp311-abi3-win_amd64.whl 6225d3ebe26a55dbc8ead5ad1265c0403552a63336499564675b29eb3184c09b
          fastapi 0.128.2 fastapi-0.128.2-py3-none-any.whl 55bfd9490ca0125707d80e785583c2dc57840bb66e3a0bbc087d20c364964dc0
          h11 0.16.0 h11-0.16.0-py3-none-any.whl 63cf8bbe7522de3bf65932fda1d9c2772064ffb3dae62d55932da54b31cb6c86
          httpcore 1.0.9 httpcore-1.0.9-py3-none-any.whl 2d400746a40668fc9dec9810239072b40b4484b640a8c38fd654a024c7a1bf55
          httpx 0.28.1 httpx-0.28.1-py3-none-any.whl d909fcccc110f8c7faf814ca82a9a4d816bc5a6dbfea25d6591d6985b8ba59ad
          idna 3.17 idna-3.17-py3-none-any.whl 466e48829084efe2548012b855df21540b96f2e20e51bd124c851536556a592c
          pycparser 3.0 pycparser-3.0-py3-none-any.whl b727414169a36b7d524c1c3e31839a521725078d7b2ff038656844266160a992
          pydantic 2.13.5 pydantic-2.13.5-py3-none-any.whl 346a034f080da3755d8e9cb5e00e8b07de1d39e4f6e2c87d8ab7cafa0b269a73
          pydantic_core 2.46.5 pydantic_core-2.46.5-cp313-cp313-win_amd64.whl 15f4a94963c95accac15b7b657bb177d3ad82bb90b0d0526d9a9b85079925db5
          starlette 0.50.0 starlette-0.50.0-py3-none-any.whl 9e5391843ec9b6e472eed1365a78c8098cfceb7a74bfd4d6b1c0c0095efb3bca
          typing_extensions 4.16.0 typing_extensions-4.16.0-py3-none-any.whl 481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8
          typing_inspection 0.4.4 typing_inspection-0.4.4-py3-none-any.whl 65b8397ba37ccbce054456aaccddfc91e6e3083c92824df348d96ca832f3f147
          uvicorn 0.48.0 uvicorn-0.48.0-py3-none-any.whl 48097851328b87ec36117d3d575234519eb58c2b22d79666e9bbc6c49a761dad'''
          rows=[]
          def obtain(url,name,digest):
              req=urllib.request.Request(url,headers={'User-Agent':'Enterprise-Offline-Dependency-Build/1'})
              with urllib.request.urlopen(req,timeout=60) as r: data=r.read(30000000)
              if hashlib.sha256(data).hexdigest()!=digest: raise RuntimeError('checksum mismatch '+name)
              (out/name).write_bytes(data)
              with zipfile.ZipFile(out/name) as z:
                  if z.testzip() is not None: raise RuntimeError('CRC failure '+name)
              rows.append({'filename':name,'url':url,'sha256':digest,'size':len(data)})
              print('VERIFIED',name,len(data))
          name='python-3.13.15-embed-amd64.zip'
          obtain('https://www.python.org/ftp/python/3.13.15/'+name,name,'d1f04d990aee1253d8569e8e5104e30fa9f5fa830899f14843448872d936a2cf')
          for line in pins.splitlines():
              package,version,name,digest=line.split()
              with urllib.request.urlopen('https://pypi.org/pypi/'+package+'/'+version+'/json',timeout=30) as r: meta=json.load(r)
              item=next(x for x in meta['urls'] if x['filename']==name)
              if item['digests']['sha256']!=digest or not item['url'].startswith('https://files.pythonhosted.org/'): raise RuntimeError('upstream metadata mismatch '+name)
              obtain(item['url'],name,digest)
          (out/'VERIFIED_PUBLIC_COMPONENTS.json').write_text(json.dumps(rows,indent=2))
      - name: Obtain public NSIS build tool packages
        shell: bash
        run: |
          set -eu
          mkdir -p public-dependencies/build-tools
          cd public-dependencies/build-tools
          apt-get download nsis nsis-common
          sha256sum *.deb > SHA256SUMS
      - name: Save public components for local offline assembly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enterprise-public-offline-components
          path: public-dependencies/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
